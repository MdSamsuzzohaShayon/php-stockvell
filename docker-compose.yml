services:
  app:
    container_name: php_finance_con
    build:
      context: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: mysql_db_con
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockvel_db
      MYSQL_USER: shayon
      MYSQL_PASSWORD: Test1234
    ports:
      - "3306:3306"